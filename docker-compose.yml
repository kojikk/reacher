version: '3.8'

services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-server
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:' + (process.env.PORT || 3000), (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    volumes:
      - ./src:/app/src
      - ./index.js:/app/index.js
      # Mount the host ssh-runtime dir read-only at a staging path;
      # entrypoint copies files into /root/.ssh with correct perms (bind-mounted
      # files from Windows do not honor unix 0600 that ssh requires).
      - ./ssh-runtime:/mnt/ssh-runtime:ro
    entrypoint:
      - sh
      - -c
      - |
        mkdir -p /root/.ssh &&
        cp /mnt/ssh-runtime/reacher-key /root/.ssh/reacher-key &&
        cp /mnt/ssh-runtime/config /root/.ssh/config &&
        touch /root/.ssh/known_hosts &&
        chmod 700 /root/.ssh &&
        chmod 600 /root/.ssh/reacher-key /root/.ssh/config &&
        chmod 644 /root/.ssh/known_hosts &&
        exec node index.js
